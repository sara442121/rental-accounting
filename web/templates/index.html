<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>داشبورد حسابداری ابزارآلات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #2C3E50; text-align: center; }
        .menu { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .menu a { text-decoration: none; color: white; background: #3498DB; padding: 10px 20px; border-radius: 5px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; text-align: center; }
        .stat-box { padding: 20px; background: #ecf0f1; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>سیستم حسابداری ابزارآلات</h1>
        <div class="menu">
            <a href="/customers">مشتریان</a>
            <a href="/tools">کالاها</a>
            <a href="/rentals">قراردادها</a>
        </div>
        <div class="stats">
            <div class="stat-box"><h3>مشتریان</h3><p>{{ customers|length }}</p></div>
            <div class="stat-box"><h3>کالاها</h3><p>{{ tools|length }}</p></div>
            <div class="stat-box"><h3>اجاره‌های فعال</h3><p>{{ rentals|length }}</p></div>
        </div>
    </div>
</body>
</html>
