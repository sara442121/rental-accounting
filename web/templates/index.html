<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>داشبورد مدیریتی</title>
    <style>
        body { font-family: Tahoma; background: #f4f4f4; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .stats { display: flex; justify-content: space-between; margin: 20px 0; }
        .stat-box { background: #ecf0f1; padding: 15px; border-radius: 8px; width: 30%; text-align: center; }
        .import-section { border: 2px dashed #3498DB; padding: 20px; margin-top: 30px; text-align: center; }
        button { background: #27AE60; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>داشبورد مدیریتی سیستم حسابداری</h2>
        <div class="stats">
            <div class="stat-box"><h3>درآمد</h3><p>{{ "{:,.0f}".format(income) }}</p></div>
            <div class="stat-box"><h3>هزینه</h3><p>{{ "{:,.0f}".format(expenses) }}</p></div>
            <div class="stat-box"><h3>سود</h3><p>{{ "{:,.0f}".format(profit) }}</p></div>
        </div>

        <div class="import-section">
            <h3>📥 ورود خودکار کالاها از اکسل</h3>
            <p>فایل اکسل خود را انتخاب کنید (ستون‌های مورد نیاز: کد، نام، تعداد)</p>
            <form action="/import_tools" method="post" enctype="multipart/form-data">
                <input type="file" name="file" accept=".xlsx, .xls, .csv" required>
                <br><br>
                <button type="submit">بارگذاری و ثبت در انبار</button>
            </form>
        </div>
        
        <p style="text-align: center; margin-top: 20px;"><a href="/logout">خروج از سیستم</a></p>
    </div>
</body>
</html>
