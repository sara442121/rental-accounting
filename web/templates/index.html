<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>داشبورد حسابداری ابزارآلات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #2C3E50; text-align: center; }
        .menu { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .menu a { text-decoration: none; color: white; background: #3498DB; padding: 10px 20px; border-radius: 5px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; text-align: center; margin-bottom: 30px; }
        .stat-box { padding: 20px; background: #ecf0f1; border-radius: 8px; border-top: 4px solid #3498DB; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>سیستم حسابداری ابزارآلات</h1>
        <div class="menu">
            <a href="/customers">مدیریت مشتریان</a>
            <a href="/tools">مدیریت کالاها</a>
            <a href="/rentals">قراردادهای اجاره</a>
        </div>
        <div class="stats">
            <div class="stat-box"><h3>مشتریان</h3><p style="font-size: 24px; font-weight: bold;">{{ c_count }}</p></div>
            <div class="stat-box"><h3>کالاها</h3><p style="font-size: 24px; font-weight: bold;">{{ t_count }}</p></div>
            <div class="stat-box"><h3>اجاره‌های فعال</h3><p style="font-size: 24px; font-weight: bold;">{{ r_count }}</p></div>
        </div>
        
        <h2>آخرین قراردادها</h2>
        <table>
            <thead>
                <tr>
                    <th>مشتری</th>
                    <th>کالا</th>
                    <th>تاریخ شروع</th>
                    <th>مبلغ</th>
                </tr>
            </thead>
            <tbody>
                {% for r in recent_rentals %}
                <tr>
                    <td>{{ r.cname }}</td>
                    <td>{{ r.tname }}</td>
                    <td>{{ r.start_time }}</td>
                    <td>{{ r.amount }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
