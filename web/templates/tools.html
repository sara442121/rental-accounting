<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدیریت کالاها</title>
    <style>
        body { font-family: Tahoma; background: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #2C3E50; color: white; }
        button { padding: 8px 20px; background: #27AE60; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>مدیریت کالاها</h1>
        <a href="/">بازگشت به داشبورد</a>
        
        <form action="/add_tool" method="post" style="margin-top: 20px; border: 1px solid #ddd; padding: 15px;">
            <h3>افزودن کالای جدید</h3>
            <input type="text" name="name" placeholder="نام کالا" required>
            <input type="text" name="code" placeholder="کد کالا" required>
            <input type="number" name="daily_price" placeholder="قیمت روزانه" required>
            <button type="submit">ثبت کالا</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>کد</th>
                    <th>نام</th>
                    <th>قیمت روزانه</th>
                    <th>وضعیت</th>
                </tr>
            </thead>
            <tbody>
                {% for t in tools %}
                <tr>
                    <td>{{ t.code }}</td>
                    <td>{{ t.name }}</td>
                    <td>{{ t.daily_price }}</td>
                    <td>{{ t.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
