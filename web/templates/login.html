<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به سیستم حسابداری</title>
    <style>
        body { font-family: Tahoma; background: #34495E; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.3); text-align: center; width: 350px; }
        h2 { color: #2C3E50; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27AE60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .flash { color: #E74C3C; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ورود ایمن به سیستم</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="نام کاربری" required>
            <input type="password" name="password" placeholder="رمز عبور" required>
            <button type="submit">ورود به داشبورد</button>
        </form>
        <p style="font-size: 12px; color: #7F8C8D; margin-top: 20px;">پیش‌فرض: admin / admin123</p>
    </div>
</body>
</html>
